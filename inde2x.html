<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>دفتر معاملات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#111;padding:18px 14px 35px}.wrap{max-width:650px;margin:auto}h1{font-size:25px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 14px #0000000d}label{display:block;font-size:13px;color:#666;margin:12px 2px 5px}input,select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;background:#fafafa;color:#111;font-size:17px}textarea{min-height:75px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg input{display:none}.seg label{margin:0;text-align:center;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:16px;color:#333}.seg input:checked+label{background:#111;color:#fff;border-color:#111}.section{border:1px solid #e8e8ed;border-radius:17px;padding:13px;margin-top:12px}.sectionTitle{font-weight:800;font-size:18px}.buyTitle{color:#16863c}.sellTitle{color:#c93832}.rateBox{background:#f7f7fa;border-radius:16px;padding:13px;margin:12px 0}.calc{font-size:13px;color:#666;margin-top:8px;line-height:1.7}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-size:18px;font-weight:700;background:#007aff;color:#fff;margin-top:15px}.small{font-size:13px;color:#777}.trade{border:1px solid #e7e7ec;border-radius:16px;padding:14px;margin-top:12px}.tradeHead{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #eee;padding-bottom:10px}.tradeFlow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;margin:13px 0}.flowBox{background:#f7f7fa;border-radius:13px;padding:11px;text-align:center}.flowBox b{display:block;font-size:17px}.arrow{font-size:22px}.ratePill{text-align:center;background:#eef5ff;border-radius:11px;padding:8px;margin:8px 0;font-weight:700}.meta{font-size:13px;color:#777;line-height:1.8}.actions{display:flex;gap:8px;margin-top:9px}.actions button{border:0;border-radius:10px;padding:8px 10px}.danger{background:#ff3b30;color:#fff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#f6f6f6;border-radius:13px;padding:12px;text-align:center}.box b{display:block;font-size:18px;margin-top:4px}
@media(max-width:420px){.row{grid-template-columns:1fr}.tradeFlow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
@media(prefers-color-scheme:dark){body{background:#000;color:#fff}.card{background:#1c1c1e}.section{border-color:#38383a}input,select,textarea,.box,.flowBox,.rateBox{background:#2c2c2e;color:#fff;border-color:#444}.small,label,.meta,.calc{color:#aaa}.trade,.tradeHead{border-color:#333}.ratePill{background:#18314f}}
</style></head><body><div class="wrap"><h1>دفتر معاملات</h1>
<div class="card"><label>نام طرف مقابل</label><input id="party" placeholder="مثلاً شرکت / مشتری">
<div class="section"><div class="sectionTitle buyTitle">خرید</div><div class="row"><div><label>ارز خرید</label><select id="buyCurrency"></select></div><div><label>مبلغ خرید</label><input id="buyAmount" type="number" inputmode="decimal" placeholder="0"></div></div></div>
<div class="rateBox"><label style="margin-top:0">ریت تبدیل</label><input id="rate" type="number" inputmode="decimal" step="any" placeholder="0"><div id="calcHint" class="calc">مبلغ فروش = مبلغ خرید × ریت</div></div>
<div class="section"><div class="sectionTitle sellTitle">فروش</div><div class="row"><div><label>ارز فروش</label><select id="sellCurrency"></select></div><div><label>مبلغ فروش</label><input id="sellAmount" type="number" inputmode="decimal" placeholder="خودکار محاسبه می‌شود"></div></div></div>
<label>کمیسیون</label><div class="seg"><input type="radio" name="commissionType" id="creceive" value="دریافت" checked><label for="creceive">دریافت</label><input type="radio" name="commissionType" id="cpay" value="پرداخت"><label for="cpay">پرداخت</label></div>
<div class="row"><div><label>ارز کمیسیون</label><select id="commissionCurrency"></select></div><div><label>مبلغ کمیسیون</label><input id="commission" type="number" inputmode="decimal" placeholder="0"></div></div>
<label>شماره معامله</label><input id="txid" placeholder="اختیاری"><label>توضیحات</label><textarea id="desc" placeholder="توضیحات معامله"></textarea><button class="btn" onclick="saveTrade()">ثبت معامله</button></div>
<div class="card"><div style="display:flex;justify-content:space-between"><b>خلاصه</b><span id="count" class="small"></span></div><div class="summary"><div class="box">تعداد معاملات<b id="nTrades">۰</b></div><div class="box">آخرین کمیسیون<b id="lastCommission">۰</b></div></div></div>
<div class="card"><b>معاملات ثبت‌شده</b><div id="list"><p class="small">هنوز معامله‌ای ثبت نشده.</p></div></div></div>
<script>
const $=id=>document.getElementById(id); const currencies=[['USD','🇺🇸','دلار'],['USD TEH','🇮🇷','دلار تهران'],['EUR','🇪🇺','یورو'],['CNY','🇨🇳','یوان'],['CAD','🇨🇦','دلار کانادا'],['AED','🇦🇪','درهم'],['TMN','🇮🇷','تومان'],['TRL','🇹🇷','لیر ترکیه']];
const opts=()=>currencies.map(x=>`<option value="${x[0]}">${x[1]} ${x[0]} - ${x[2]}</option>`).join(''); ['buyCurrency','sellCurrency','commissionCurrency'].forEach(id=>$(id).innerHTML=opts()); $('sellCurrency').value='TMN';
let trades=JSON.parse(localStorage.getItem('tradebook_v2')||'[]'); const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:4}); const flag=c=>(currencies.find(x=>x[0]===c)||['',''])[1]||'';
function calculate(){let a=+$('buyAmount').value,r=+$('rate').value;if(a&&r){$('sellAmount').value=+(a*r).toFixed(6);$('calcHint').textContent=`${fmt(a)} ${$('buyCurrency').value} × ${fmt(r)} = ${fmt(a*r)} ${$('sellCurrency').value}`;}else $('calcHint').textContent='مبلغ فروش = مبلغ خرید × ریت'}
['buyAmount','rate','buyCurrency','sellCurrency'].forEach(id=>$(id).addEventListener('input',calculate));
function saveTrade(){let buyAmount=+$('buyAmount').value,rate=+$('rate').value,sellAmount=+$('sellAmount').value;if(!$('party').value.trim()){alert('نام طرف مقابل را وارد کنید.');return}if(!buyAmount){alert('مبلغ خرید را وارد کنید.');return}if(!rate){alert('ریت را وارد کنید.');return}if(!sellAmount)sellAmount=buyAmount*rate;const t={id:Date.now(),date:new Date().toLocaleString('fa-IR'),party:$('party').value.trim(),buyCurrency:$('buyCurrency').value,buyAmount,rate,sellCurrency:$('sellCurrency').value,sellAmount,commission:+$('commission').value||0,commissionCurrency:$('commissionCurrency').value,commissionType:document.querySelector('input[name="commissionType"]:checked').value,txid:$('txid').value.trim(),desc:$('desc').value.trim()};trades.unshift(t);localStorage.setItem('tradebook_v2',JSON.stringify(trades));['buyAmount','rate','sellAmount','commission','txid','desc'].forEach(x=>$(x).value='');calculate();render()}
function del(id){if(confirm('این معامله حذف شود؟')){trades=trades.filter(t=>t.id!==id);localStorage.setItem('tradebook_v2',JSON.stringify(trades));render()}}
function render(){$('nTrades').textContent=trades.length.toLocaleString('fa-IR');$('lastCommission').textContent=trades.length?(trades[0].commission?`${trades[0].commissionType} ${fmt(trades[0].commission)} ${trades[0].commissionCurrency}`:'۰'):'۰';$('list').innerHTML=trades.length?trades.map(t=>`<div class="trade"><div class="tradeHead"><b>${t.party}</b><span class="small">${t.date}</span></div><div class="tradeFlow"><div class="flowBox"><span class="small">خرید</span><b>${flag(t.buyCurrency)} ${fmt(t.buyAmount)} ${t.buyCurrency}</b></div><div class="arrow">←</div><div class="flowBox"><span class="small">فروش</span><b>${flag(t.sellCurrency)} ${fmt(t.sellAmount)} ${t.sellCurrency}</b></div></div><div class="ratePill">ریت: ${fmt(t.rate)}</div><div class="meta">کمیسیون: ${t.commissionType} ${fmt(t.commission)} ${flag(t.commissionCurrency)} ${t.commissionCurrency}${t.txid?`<br>شماره معامله: ${t.txid}`:''}${t.desc?`<br>توضیحات: ${t.desc}`:''}</div><div class="actions"><button class="danger" onclick="del(${t.id})">حذف</button></div></div>`).join(''):'<p class="small">هنوز معامله‌ای ثبت نشده.</p>'}
render();
</script></body></html>
