<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>دفتر معاملات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#111;padding:18px 14px 35px}.wrap{max-width:650px;margin:auto}h1{font-size:25px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 14px #0000000d}label{display:block;font-size:13px;color:#666;margin:12px 2px 5px}input,select,textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:13px;background:#fafafa;color:#111;font-size:17px}textarea{min-height:75px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg input{display:none}.seg label{margin:0;text-align:center;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:16px;color:#333}.seg input:checked+label{background:#111;color:#fff;border-color:#111}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-size:18px;font-weight:700;background:#007aff;color:#fff;margin-top:15px}.small{font-size:13px;color:#777}.trade{border-bottom:1px solid #eee;padding:12px 0}.trade:last-child{border:0}.top{display:flex;justify-content:space-between;gap:8px}.amt{font-weight:800}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:10px;padding:8px 10px}.danger{background:#ff3b30;color:#fff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#f6f6f6;border-radius:13px;padding:12px;text-align:center}.box b{display:block;font-size:18px;margin-top:4px}
@media(prefers-color-scheme:dark){body{background:#000;color:#fff}.card{background:#1c1c1e}input,select,textarea,.box{background:#2c2c2e;color:#fff;border-color:#444}.seg label{color:#eee;border-color:#555}.small,label{color:#aaa}.trade{border-color:#333}}
</style>
</head>
<body><div class="wrap">
<h1>دفتر معاملات</h1>
<div class="card">
<label>نام طرف مقابل</label><input id="party" placeholder="مثلاً شرکت / مشتری">
<label>نوع معامله</label>
<div class="seg">
<input type="radio" name="type" id="buy" value="خرید" checked><label for="buy">خرید</label>
<input type="radio" name="type" id="sell" value="فروش"><label for="sell">فروش</label>
</div>
<label>ارز</label><select id="currency"><option>USD - دلار</option><option>AED - درهم</option><option>EUR - یورو</option><option>CAD - دلار کانادا</option><option>IRR - ریال</option></select>
<label>مبلغ</label><input id="amount" type="number" inputmode="decimal" placeholder="0">
<label>ریت</label><input id="rate" type="number" inputmode="decimal" placeholder="0">
<label>کمیسیون</label>
<div class="seg">
<input type="radio" name="commissionType" id="creceive" value="دریافت" checked><label for="creceive">دریافت</label>
<input type="radio" name="commissionType" id="cpay" value="پرداخت"><label for="cpay">پرداخت</label>
</div>
<label>مبلغ کمیسیون</label><input id="commission" type="number" inputmode="decimal" placeholder="0">
<label>شماره معامله</label><input id="txid" placeholder="اختیاری">
<label>توضیحات</label><textarea id="desc" placeholder="توضیحات معامله"></textarea>
<button class="btn" onclick="saveTrade()">ثبت معامله</button>
</div>

<div class="card">
<div class="top"><b>خلاصه</b><span id="count" class="small"></span></div>
<div class="summary">
<div class="box">تعداد معاملات<b id="nTrades">۰</b></div>
<div class="box">کمیسیون خالص<b id="netCommission">۰</b></div>
</div>
</div>

<div class="card"><b>معاملات ثبت‌شده</b><div id="list"><p class="small">هنوز معامله‌ای ثبت نشده.</p></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let trades=JSON.parse(localStorage.getItem("tradebook_v1")||"[]");
const fmt=n=>Number(n||0).toLocaleString("en-US");
function saveTrade(){
 let amount=+$("amount").value, rate=+$("rate").value;
 if(!$("party").value.trim()){alert("نام طرف مقابل را وارد کنید.");return}
 if(!amount){alert("مبلغ را وارد کنید.");return}
 const t={id:Date.now(),date:new Date().toLocaleString("fa-IR"),party:$("party").value.trim(),
 type:document.querySelector('input[name="type"]:checked').value,currency:$("currency").value,
 amount,rate,commission:+$("commission").value||0,
 commissionType:document.querySelector('input[name="commissionType"]:checked').value,
 txid:$("txid").value.trim(),desc:$("desc").value.trim()};
 trades.unshift(t); localStorage.setItem("tradebook_v1",JSON.stringify(trades));
 ["amount","rate","commission","txid","desc"].forEach(x=>$(x).value=""); render();
}
function del(id){if(confirm("این معامله حذف شود؟")){trades=trades.filter(t=>t.id!==id);localStorage.setItem("tradebook_v1",JSON.stringify(trades));render()}}
function render(){
 $("nTrades").textContent=trades.length.toLocaleString("fa-IR");
 let net=trades.reduce((s,t)=>s+(t.commissionType==="دریافت"?t.commission:-t.commission),0);
 $("netCommission").textContent=fmt(net);
 $("list").innerHTML=trades.length?trades.map(t=>`<div class="trade">
 <div class="top"><span><b>${t.party}</b> · ${t.type}</span><span class="amt">${fmt(t.amount)} ${t.currency.split(" ")[0]}</span></div>
 <div class="small">${t.date}${t.rate?` · ریت: ${fmt(t.rate)}`:""}</div>
 <div class="small">کمیسیون: ${t.commissionType} ${fmt(t.commission)}${t.txid?` · شماره: ${t.txid}`:""}</div>
 ${t.desc?`<div>${t.desc}</div>`:""}
 <div class="actions"><button class="danger" onclick="del(${t.id})">حذف</button></div></div>`).join(""):'<p class="small">هنوز معامله‌ای ثبت نشده.</p>';
}
render();
</script></body></html>
